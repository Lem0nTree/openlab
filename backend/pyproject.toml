[project]
name = "openlab-server"
version = "0.1.0"
description = "Local-first intelligence layer for electronics labs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "qrcode[pil]>=8.0,<9",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["B008", "EXE002"] # FastAPI DI and Windows executable-bit mounts.

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["openlab"]
