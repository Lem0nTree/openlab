name: CI

on:
  push:
  pull_request:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - run: cd installer && go test -race ./... && go vet ./...
      - name: Static Linux build checks
        run: |
          cd installer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/openlabctl-amd64 ./cmd/openlabctl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/openlabctl-arm64 ./cmd/openlabctl
      - name: Lifecycle fault injection in disposable root filesystem (no Docker socket)
        run: |
          cd installer
          CGO_ENABLED=0 go test -tags integration -c -o /tmp/openlab-lifecycle.test ./internal/control
          docker run --rm --network none -e OPENLAB_DISPOSABLE_TEST=1 --mount type=bind,src=/tmp/openlab-lifecycle.test,dst=/test,readonly debian:bookworm-slim /test -test.run TestDisposableLifecycle -test.v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: cd backend && uv sync --locked --group dev
      - run: cd backend && uv run ruff check . && uv run pytest
      - run: cd backend && DATABASE_URL=postgresql+psycopg://openlab:openlab@127.0.0.1:5432/openlab PYTHONPATH=src uv run python -c "import json; from pathlib import Path; from openlab.main import app; Path('../openapi.json').write_text(json.dumps(app.openapi(), indent=2), encoding='utf-8')"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm generate:api && git diff --exit-code -- ../openapi.json src/lib/openapi.d.ts && pnpm typecheck && pnpm build && pnpm test
